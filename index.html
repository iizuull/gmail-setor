<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SetoranKu - Earn Rewards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #f43f5e; --bg: #f8fafc; --text: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }

        /* Loading */
        #loading { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
        .spinner { width: 35px; height: 35px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        
        /* Header Card */
        .header-card { background: linear-gradient(135deg, #f43f5e, #fb7185); border-radius: 24px; padding: 25px; color: white; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 20px rgba(244, 63, 94, 0.2); }
        .saldo-info p { font-size: 12px; font-weight: 600; opacity: 0.9; }
        .saldo-info h2 { font-size: 26px; font-weight: 800; }
        .btn-tarik { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 10px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; backdrop-filter: blur(5px); transition: 0.3s; }
        .btn-tarik:hover { background: rgba(255,255,255,0.4); }

        /* Form & Card */
        .card { background: white; border-radius: 20px; padding: 20px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        h3 { font-size: 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        textarea, input, select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-size: 14px; outline: none; margin-bottom: 12px; }
        .btn-send { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .btn-send:active { transform: scale(0.98); }

        /* History */
        .history-item { background: white; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .status { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .pending { background: #fef9c3; color: #854d0e; }
        .success { background: #dcfce7; color: #166534; }
        .failed { background: #fee2e2; color: #991b1b; }

        /* Admin Controls */
        .admin-box { background: #1e293b; color: white; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .admin-item { background: white; color: var(--text); padding: 15px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loading"><div class="spinner"></div></div>

<div class="container">
    <div id="auth-area" class="card hidden" style="text-align: center; margin-top: 50px;">
        <h2 style="margin-bottom: 10px;">SetoranKu 👋</h2>
        <p style="font-size: 14px; color: #64748b; margin-bottom: 25px;">Login untuk setor akun & tarik saldo.</p>
        <button onclick="login()" class="btn-send" style="background:white; color:#1e293b; border:1px solid #ddd;">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Masuk Google
        </button>
    </div>

    <div id="main-area" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <p style="font-weight: 800; font-size: 18px;">Dashboard</p>
            <img id="user-pfp" src="" width="32" style="border-radius: 50%; cursor: pointer;" onclick="auth.signOut()">
        </div>

        <div class="header-card">
            <div class="saldo-info">
                <p>Saldo Kamu</p>
                <h2 id="user-saldo">Rp 0</h2>
            </div>
            <button class="btn-tarik" onclick="requestTarik()">Tarik Saldo</button>
        </div>

        <div id="user-view" class="hidden">
            <div class="card">
                <h3><i class="fa-solid fa-paper-plane" style="color:var(--primary)"></i> Setor Akun</h3>
                <textarea id="bulk-input" rows="4" placeholder="email|password" oninput="updateCount()"></textarea>
                <p id="counter" style="font-size: 11px; font-weight: 700; color: var(--primary); margin-bottom: 10px;">0 Akun Terdeteksi</p>
                <input type="number" id="pay-rek" placeholder="Nomor DANA/SeaBank">
                <button class="btn-send" onclick="sendData()">Kirim Setoran</button>
            </div>
            
            <p style="font-weight: 800; margin-bottom: 10px; font-size: 14px;">Riwayat Terbaru</p>
            <div id="user-history"></div>
        </div>

        <div id="admin-view" class="hidden">
            <div class="admin-box">
                <p style="font-weight: 700;">Panel Admin (Fikor)</p>
                <p style="font-size: 11px; opacity: 0.8;">Kelola setoran pending di bawah.</p>
            </div>
            <div id="admin-list"></div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, onSnapshot, orderBy, where, serverTimestamp, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCsF9mAj8UIbNOZFdd9F_7vvoVFMBm3Aik",
        authDomain: "mail-id-2948b.firebaseapp.com",
        projectId: "mail-id-2948b",
        storageBucket: "mail-id-2948b.firebasestorage.app",
        messagingSenderId: "184711293174",
        appId: "1:184711293174:web:bc158d490893cd3757a4d7"
    };

    const ADMIN_EMAIL = "fikorfikor0@gmail.com";
    const HARGA_PER_AKUN = 2500; // Update Harga per Akun jadi 2500

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.login = () => signInWithPopup(auth, provider);

    onAuthStateChanged(auth, (user) => {
        const authArea = document.getElementById('auth-area');
        const mainArea = document.getElementById('main-area');
        if(user) {
            authArea.classList.add('hidden'); mainArea.classList.remove('hidden');
            document.getElementById('user-pfp').src = user.photoURL;
            if(user.email === ADMIN_EMAIL) {
                document.getElementById('admin-view').classList.remove('hidden');
                loadAdminData();
            } else {
                document.getElementById('user-view').classList.remove('hidden');
                loadUserData(user.uid);
            }
        } else {
            authArea.classList.remove('hidden'); mainArea.classList.add('hidden');
        }
        document.getElementById('loading').classList.add('hidden');
    });

    // --- USER LOGIC ---
    window.updateCount = () => {
        const val = document.getElementById('bulk-input').value.trim();
        document.getElementById('counter').innerText = `${val ? val.split('\n').length : 0} Akun Terdeteksi`;
    };

    window.sendData = async () => {
        const input = document.getElementById('bulk-input').value.trim();
        const rek = document.getElementById('pay-rek').value;
        if(!input || !rek) return alert("Isi data!");
        
        const list = input.split('\n').map(l => {
            const [e, p] = l.split('|');
            return { email: e?.trim(), pass: p?.trim() };
        });

        await addDoc(collection(db, "setoran"), {
            uid: auth.currentUser.uid, uName: auth.currentUser.displayName,
            akun: list, total: list.length, rek, status: 'pending', timestamp: serverTimestamp()
        });
        alert("Terkirim!"); document.getElementById('bulk-input').value = "";
    };

    function loadUserData(uid) {
        const q = query(collection(db, "setoran"), where("uid", "==", uid), orderBy("timestamp", "desc"));
        onSnapshot(q, (s) => {
            let totalAcc = 0;
            document.getElementById('user-history').innerHTML = s.docs.map(d => {
                const data = d.data();
                if(data.status === 'success') totalAcc += data.total;
                return `<div class="history-item">
                    <div><p style="font-weight:700">${data.total} Akun</p><p style="font-size:10px; color:gray">${data.timestamp?.toDate().toLocaleDateString()}</p></div>
                    <span class="status ${data.status}">${data.status}</span>
                </div>`;
            }).join('');
            // Kalkulasi Saldo dengan harga 2500
            document.getElementById('user-saldo').innerText = `Rp ${(totalAcc * HARGA_PER_AKUN).toLocaleString()}`;
        });
    }

    window.requestTarik = () => {
        const saldo = document.getElementById('user-saldo').innerText;
        if(saldo === "Rp 0") return alert("Saldo kamu masih kosong!");
        const botToken = "8606712063:AAFNW8wXDOVfNy4IRzIUNT2PaavUJBayoy0";
        const chatId = "7233546224";
        const pesan = `💸 *PENARIKAN SALDO*\nUser: ${auth.currentUser.displayName}\nJumlah: ${saldo}\nSegera diproses!`;
        fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(pesan)}&parse_mode=Markdown`);
        alert("Permintaan tarik saldo dikirim ke admin!");
    };

    // --- ADMIN LOGIC ---
    function loadAdminData() {
        const q = query(collection(db, "setoran"), where("status", "==", "pending"), orderBy("timestamp", "desc"));
        onSnapshot(q, (s) => {
            document.getElementById('admin-list').innerHTML = s.docs.map(d => {
                const data = d.data();
                return `<div class="admin-item">
                    <p><strong>${data.uName}</strong> (${data.rek})</p>
                    <div style="font-size:11px; background:#f8fafc; padding:8px; border-radius:8px; margin:8px 0; border:1px solid #eee">
                        ${data.akun.map(a => `${a.email}|${a.pass}`).join('<br>')}
                    </div>
                    <div style="display:flex; gap:8px">
                        <button onclick="updateStatus('${d.id}', 'success')" style="flex:1; padding:10px; background:#22c55e; color:white; border:none; border-radius:10px; font-weight:700">ACC</button>
                        <button onclick="updateStatus('${d.id}', 'failed')" style="flex:1; padding:10px; background:#ef4444; color:white; border:none; border-radius:10px; font-weight:700">TOLAK</button>
                    </div>
                </div>`;
            }).join('');
        });
    }

    window.updateStatus = async (id, stat) => {
        await updateDoc(doc(db, "setoran", id), { status: stat });
    };
</script>

</body>
</html>
